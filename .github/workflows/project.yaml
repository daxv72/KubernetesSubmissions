name: Deploy project

on:
  push:
    branches:
      - main
    paths:
      - the_project/**
      - overlays/gke/**
      - .github/workflows/project.yaml

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: my-repository

jobs:
  build-publish-deploy:
    name: Build, publish and deploy the project
    runs-on: ubuntu-latest
    environment: GKE_PROJECT
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud --quiet auth configure-docker "$REGISTRY"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          project_id: ${{ env.PROJECT_ID }}
          location: ${{ env.GKE_ZONE }}

      - name: Form image names
        run: |
          echo "TODO_APP_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-app:main-$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "TODO_BACKEND_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:main-$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "READ_WIKIPEDIA_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/read-wikipedia:main-$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Build
        run: |
          docker build --tag "$TODO_APP_TAG" the_project/todo-app
          docker build --tag "$TODO_BACKEND_TAG" the_project/todo-backend
          docker build --tag "$READ_WIKIPEDIA_TAG" the_project/read-wikipedia

      - name: Publish
        run: |
          docker push "$TODO_APP_TAG"
          docker push "$TODO_BACKEND_TAG"
          docker push "$READ_WIKIPEDIA_TAG"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Deploy
        working-directory: overlays/gke
        run: |
          kustomize edit set image \
            todo-app="$TODO_APP_TAG" \
            todo-backend="$TODO_BACKEND_TAG" \
            read-wikipedia="$READ_WIKIPEDIA_TAG"
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/todo-app -n project
          kubectl rollout status deployment/todo-backend -n project
          kubectl rollout status statefulset/postgres -n project
