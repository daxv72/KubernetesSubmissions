apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-app-config
  namespace: project
data:
  PORT: "3000"
  BIND_ADDRESS: 0.0.0.0
  IMAGE_DIR: /usr/src/app/files
  IMAGE_FILE: image.jpg
  META_FILE: meta.txt
  CACHE_SECONDS: "600"
  PICSUM_URL: https://picsum.photos/1200
  TODO_BACKEND_URL: http://todo-backend:2345/todos
  IMAGE_ROUTE: /image
  FORM_ACTION: /todos
  TODO_FIELD: todo
  MAX_LENGTH: "140"
