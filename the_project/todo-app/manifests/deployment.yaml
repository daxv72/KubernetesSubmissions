apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  labels:
    app: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      securityContext:
        fsGroup: 65534
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: todo-image-claim
      containers:
        - name: todo-app
          image: todo-app:1.13
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: IMAGE_DIR
              value: /usr/src/app/files
            - name: CACHE_SECONDS
              value: "600"
            - name: PICSUM_URL
              value: https://picsum.photos/1200
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: image-cache
              mountPath: /usr/src/app/files
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
