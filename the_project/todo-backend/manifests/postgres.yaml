# Headless Service in the project namespace. serviceName below must match.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: project
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: project
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18.0
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-auth
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "todos"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "todos"]
            periodSeconds: 10
          volumeMounts:
            # Postgres 18 stores data under /var/lib/postgresql/18/docker.
            - name: data
              mountPath: /var/lib/postgresql
          # Idle on k3d: 11m CPU, 30Mi. The request keeps the database off a packed node.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 100Mi
