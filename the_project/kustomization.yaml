apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - image-claim.yaml
  - todo-app/manifests/configmap.yaml
  - todo-app/manifests/deployment.yaml
  - todo-app/manifests/service.yaml
  - todo-app/manifests/ingress.yaml
  - todo-backend/manifests/secret.yaml
  - todo-backend/manifests/configmap.yaml
  - todo-backend/manifests/postgres.yaml
  - todo-backend/manifests/deployment.yaml
  - todo-backend/manifests/service.yaml
  - broadcaster/manifests/configmap.yaml
  - broadcaster/manifests/deployment.yaml
  - webhook/manifests/configmap.yaml
  - webhook/manifests/deployment.yaml
  - webhook/manifests/service.yaml
  - read-wikipedia/manifests/configmap.yaml
  - read-wikipedia/manifests/cronjob.yaml
  - backup/configmap.yaml
  - backup/cronjob.yaml
images:
  - name: todo-app
    newTag: "4.5"
  - name: todo-backend
    newTag: "4.6"
  - name: todo-broadcaster
    newTag: "4.9"
  - name: todo-webhook
    newTag: "4.6"
  - name: read-wikipedia
    newTag: "2.9"
  - name: todo-backup
    newTag: "3.10"
