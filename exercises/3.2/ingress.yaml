# Same shape as the course sample: no ingressClassName.
# On GKE the default controller is gce. It health-checks each Pod with GET /.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: log-output
  namespace: exercises
spec:
  rules:
    - http:
        paths:
          - path: /pingpong
            pathType: Prefix
            backend:
              service:
                name: ping-pong
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: log-output
                port:
                  number: 2345
