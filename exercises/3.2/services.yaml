# GKE Ingress only attaches to NodePort or LoadBalancer Services.
# The Service ports stay 3000 and 2345: log-output calls
# http://ping-pong:3000/pings, and the Ingress below uses these numbers.
# GKE does not publish the node ports on the public internet.
apiVersion: v1
kind: Service
metadata:
  name: ping-pong
  namespace: exercises
  labels:
    app: ping-pong
spec:
  type: NodePort
  selector:
    app: ping-pong
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: log-output
  namespace: exercises
  labels:
    app: log-output
spec:
  type: NodePort
  selector:
    app: log-output
  ports:
    - name: http
      port: 2345
      targetPort: 3000
