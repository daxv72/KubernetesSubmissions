apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  labels:
    app: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      # fsGroup lets USER nobody write the emptyDir.
      securityContext:
        fsGroup: 65534
      volumes:
        # Log line only. The ping count is no longer a file shared with ping-pong.
        - name: shared-log
          emptyDir: {}
      containers:
        - name: log-writer
          image: log-writer:1.11
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_PATH
              value: /usr/src/app/files/log.txt
          volumeMounts:
            - name: shared-log
              mountPath: /usr/src/app/files
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
        - name: log-reader
          image: log-reader:2.1
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: LOG_PATH
              value: /usr/src/app/files/log.txt
            - name: PING_PONG_URL
              value: http://ping-pong:3000/pings
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: shared-log
              mountPath: /usr/src/app/files
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
