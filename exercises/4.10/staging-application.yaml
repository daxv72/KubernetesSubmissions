# A commit on main of the configuration repository is applied to the namespace staging.
# Application code stays in KubernetesSubmissions. This Application does not read it.
# The Secret postgres-auth is applied outside Argo CD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/daxv72/KubernetesConfigurations.git
    targetRevision: main
    path: staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
