# Three pods so the exercise query returns 3.
# The Helm release from chapter 3 runs in the monitoring namespace and does not
# create StatefulSet pods in the prometheus namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: counted
  namespace: prometheus
spec:
  clusterIP: None
  selector:
    app: counted
  ports:
    - name: http
      port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: counted
  namespace: prometheus
spec:
  serviceName: counted
  replicas: 3
  selector:
    matchLabels:
      app: counted
  template:
    metadata:
      labels:
        app: counted
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 10m
              memory: 16Mi
