# Replaces the ping-pong Deployment. The canary step asks Prometheus about
# the CPU of every container in this namespace. A failed analysis aborts
# the update and leaves the previous ReplicaSet in place.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ping-pong
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  strategy:
    canary:
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: ping-pong-cpu
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: ping-pong:3.4
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: BIND_ADDRESS
              value: 0.0.0.0
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_DB
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /pings
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
