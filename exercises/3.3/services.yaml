# Replaces the NodePort Services from exercise 3.2.
# Gateway API on GKE targets ClusterIP Services.
# Ports stay 3000 and 2345 so log-output can still call
# http://ping-pong:3000/pings.
apiVersion: v1
kind: Service
metadata:
  name: ping-pong
  namespace: exercises
  labels:
    app: ping-pong
spec:
  type: ClusterIP
  selector:
    app: ping-pong
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: log-output
  namespace: exercises
  labels:
    app: log-output
spec:
  type: ClusterIP
  selector:
    app: log-output
  ports:
    - name: http
      port: 2345
      targetPort: 3000
