# Replaces exercises/3.2/ingress.yaml.
# PathPrefix /pingpong is longer than /, so it wins.
# The request path is forwarded unchanged. Ping-pong still serves /pingpong.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: log-output
  namespace: exercises
spec:
  parentRefs:
    - name: my-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /pingpong
      backendRefs:
        - name: ping-pong
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: log-output
          port: 2345
